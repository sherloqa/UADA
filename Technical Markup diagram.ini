2.2. Core Components
2.2.1. Data Storage Architecture
Primary Storage: MongoDB for raw artifacts with GridFS for large files
Vector Storage: Separate vector database (Pinecone/Weaviate) for embeddings
Tenant Isolation: Shared foundational services with isolated data pipelines per team

Data Organization:

Team-specific databases in MongoDB
Team-specific indices in Vector DB with tenant metadata
Shared read-only collections for common patterns

2.2.2. Processing Pipeline
Hybrid Processing Model:

Real-time processing for critical failures/blockers (≤5 minutes SLA)
Batch processing for non-critical issues and historical analysis (≤30 minutes SLA)
On-demand processing for manual uploads

Artifact Processing:

Off-the-shelf parsers for common formats (HAR, JSON logs, etc.)
Custom ML models for complex extraction (screenshot analysis, video frames)
Vision-Language Models (VLM) for image understanding with rule-based validation

2.2.3. Multi-Agent System
text
Agent 1: Automation Execution Monitor
├── Input: Test execution results
├── Output: Failure triggers with context
└── Responsibilities: Test run monitoring, initial failure detection

Agent 2: Intelligent Failure Capture
├── Input: Failure context from Agent 1
├── Output: Collected evidence artifacts
└── Responsibilities: Evidence gathering, artifact correlation

Agent 3: AI Contextual Analysis (RAG)
├── Input: Collected evidence
├── Output: Analysis with evidence correlation
└── Responsibilities: Multi-modal RAG, root cause analysis

Agent 4: Bug vs Non-Bug Decision Engine
├── Input: Analysis from Agent 3
├── Output: Classification with confidence
└── Responsibilities: Rule-based classification, severity assessment

Agent 5: Controlled Jira Creation
├── Input: Classified defects
├── Output: Created/updated Jira tickets
└── Responsibilities: Ticket creation, workflow integration

2.2.4. Integration Layer
LangChain Tools for external system interactions (Jira, Git, CI/CD)
MCP Servers for standardized access to external systems (Jira MCP, Git MCP, Monitoring MCP)
Webhook and API integrations for real-time triggers and data ingestion


3. Technical Specifications
3.1. Embedding Strategy
Multiple Specialized Models:

Log Embeddings: CodeBERT/log-specific model for structured log data
DOM Embeddings: HTML/XML specialized model for UI structure
Code Embeddings: CodeBERT for source code and stack traces
Natural Language: General-purpose model (text-embedding-3) for summaries

Embedding Storage:

Separate collections/indices per embedding type
Metadata includes source type, timestamp, team ID, artifact reference

3.2. RAG Implementation
Router-Based Retrieval:

Rule-based router examining query keywords and metadata
Routes to relevant specialized vector stores (logs, DOM, code, etc.)
Parallel retrieval from multiple stores when needed

Knowledge Base Structure:

Tier 1: Core vector store of historical bug patterns (embedded)
Tier 2: Live querying of external systems via MCP for rare cases

Update frequency: Core store weekly, live queries on-demand

3.3. Vision Analysis Module
Hybrid Visual Analysis:

VLM Component: GPT-4V/Claude 3 for general image understanding
Rule-based CV: OpenCV for specific checks (layout comparison, component detection)
Baseline Comparison: Golden image comparison using SSIM/PSNR metrics

Output Processing:

Textual descriptions from VLM → embedded for RAG
Structured CV results → stored as metadata for rule engine

3.4. Decision Engine Rules
Classification Logic:

yaml
Bug Classification Rules:
  - UI Bug: (VLM detects anomaly) AND (DOM changes) AND (no environment issues)
  - API Bug: (Status code mismatch) OR (Contract violation) AND (backend errors)
  - Flaky Test: (Intermittent failure) AND (rerun confirms) AND (timing/race pattern)
  
Confidence Levels:
  - High: Multiple evidence sources agree + historical pattern match
  - Medium: Single strong evidence + correlation across layers
  - Low: Single evidence source + no historical pattern
Evidence Thresholds:

Minimum 2 corroborating evidence sources for High confidence

Cross-layer correlation boosts confidence level

3.5. Flaky Test Handling
Detection Mechanism:

Automatic reruns (configurable 3-5 times) for failed tests
LLM analysis of test logs for flakiness patterns
Statistical analysis over historical runs

Classification Criteria:

Pass rate < 100% and > 0% over reruns
Pattern matching: timing issues, race conditions, environment dependencies
Historical flakiness flags from previous analyses

